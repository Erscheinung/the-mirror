; Tailscale multiplayer preset. Set the host's Tailscale IP with scripts/set-mirror-host.sh (or .ps1).
[feature_flags]
preview=true
hardcoded_servers=false
user_api_requests=true
show_advanced_settings=true
support_pck_uploads=true
map_builder=true
os_shell=true
suicide_keybinding=true
enable_space_listing_pages=true
undo_redo_tools=true
the-mirror-tutorials=true
always_spin_up_local_server=false
check_version_on_start=false
join_by_ip=true

[debug_flags]
show_web_socket_debug=false

[app_protocol]
enable_app_protocol=true
protocol_name="themirror-tailscale-join"
socket_name=".themirror-tailscale-join.socket"

[firebase]
environment_variables/apiKey="mirror-local-auth" # not a Firebase key; also encrypts the saved login
environment_variables/authDomain=""
environment_variables/projectId=""
environment_variables/clientId=""
environment_variables/cacheLocation="user://mirror-tailscale-join.firebase_cache"

[mirror_secrets]
WSS_SECRET=""

[mirror]
env_name="tailscale-join"
auto_updater_bucket_uri="http://localhost/updater"
integration_test_ids={"space_id": "62f688a9bae441a580fbf504", "asset_id": "62d20252deddd0883e1803e7", "terrain_id": "62e83a4ad1869493fbc329bf"}
base_url="https://in.themirror.space"
connection_server="http://100.123.236.40:9000"
connection_server_ws="ws://100.123.236.40:9000"
landing_page_url="https://themirror.space"
; Empty keys turn analytics off (nothing is sent to Mixpanel/PostHog)
posthog_api_key=""
mixpanel_api_key=""
zone_server_port=27015
; Self-hosted login served by mirror-web-server (no Firebase)
auth_server_url="http://100.123.236.40:9000"
; Join the zone server running on the host instead of starting your own
zone_server_host="100.123.236.40"
asset_bucket=""
test_accounts=[]
